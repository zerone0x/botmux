<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><rect width="960" height="360" fill="#f3f5f8" rx="16"/><g fill="#172b4d" font-family="sans-serif"><text x="32" y="38" font-size="20" font-weight="bold">Codex async question → existing Feishu Ask card</text><text x="32" y="66" fill="#5e6c84" font-size="13">Illustration with synthetic content; existing card UI is reused.</text><rect width="248" height="188" x="32" y="92" fill="#fff" stroke="#dfe4eb" rx="12"/><text x="50" y="126" font-size="16" font-weight="bold">Native async question</text><text x="50" y="160" font-size="14">delivery: async</text><text x="50" y="186" font-size="14">questions: [...]</text><text x="50" y="224" fill="#5e6c84" font-size="14">Current turn keeps running.</text><text x="50" y="248" fill="#5e6c84" font-size="14">Card remains after completion.</text><path fill="none" stroke="#36c" stroke-width="2" d="M292 186H326l-8-6m8 6-8 6"/><rect width="284" height="188" x="338" y="92" fill="#fff" stroke="#dfe4eb" rx="12"/><path fill="#dce9ff" d="M350 92h260q12 0 12 12v32H338v-32q0-12 12-12"/><text x="356" y="121" font-size="16" font-weight="bold">Question card</text><text x="356" y="162" font-size="15">Which environment?</text><rect width="246" height="32" x="356" y="178" fill="#f3f5f8" rx="6"/><text x="368" y="199" font-size="14">○ Staging ○ Production</text><rect width="92" height="32" x="356" y="228" fill="#36c" rx="6"/><text x="377" y="249" fill="#fff" font-size="14">Submit</text><path fill="none" stroke="#36c" stroke-width="2" d="M634 186H668l-8-6m8 6-8 6"/><rect width="248" height="188" x="680" y="92" fill="#fff" stroke="#dfe4eb" rx="12"/><text x="698" y="126" font-size="16" font-weight="bold">Answer → same thread</text><text x="698" y="160" font-size="14">Original question ID retained</text><text x="698" y="186" font-size="14">Frozen initiator / canTalk</text><text x="698" y="224" fill="#5e6c84" font-size="14">Admitted through worker FIFO</text><text x="698" y="248" fill="#5e6c84" font-size="14">as a subsequent native turn.</text><text x="32" y="326" fill="#5e6c84" font-size="14">Quote the intended card when several are pending. Silent schedules do not post cards.</text></g></svg>