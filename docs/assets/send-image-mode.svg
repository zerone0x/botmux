<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="430" viewBox="0 0 1020 430"><rect width="1020" height="430" fill="#f4f6fa"/><g fill="#172b4d" font-family="Arial, sans-serif"><text x="30" y="38" font-size="22" font-weight="bold">botmux send --images screenshot.png --image-mode &lt;mode&gt;</text><text x="30" y="67" fill="#526070" font-size="14">Layout illustration only — actual sizes are determined by the Feishu client.</text><g transform="translate(30 95)"><rect width="300" height="285" fill="#fff" stroke="#d9e1ee" rx="12"/><text x="18" y="33" font-size="18">fit_horizontal (default)</text><rect width="264" height="176" x="18" y="55" fill="#e8efff" rx="5"/><path stroke="#688aca" stroke-width="7" d="M38 82h170m-170 22h220m-220 22h145m-145 22h185"/><text x="18" y="262" font-size="14">Existing Markdown output preserved</text></g><g transform="translate(360 95)"><rect width="300" height="285" fill="#fff" stroke="#d9e1ee" rx="12"/><text x="18" y="33" font-size="18">small</text><rect width="88" height="58.667" x="18" y="55" fill="#e8efff" rx="5"/><path stroke="#688aca" stroke-width="2.33" d="M25 64h57m-57 7h73m-73 7h48m-48 7h62"/><path stroke="#d9e1ee" stroke-dasharray="4 4" d="M106 50v175m88-175v175"/><text x="18" y="262" font-size="14">3 equal columns; image in column 1</text></g><g transform="translate(690 95)"><rect width="300" height="285" fill="#fff" stroke="#d9e1ee" rx="12"/><text x="18" y="33" font-size="18">tiny</text><rect width="66" height="44" x="18" y="55" fill="#e8efff" rx="4"/><path stroke="#688aca" stroke-width="2" d="M23 62h42m-42 5.5h55m-55 5.5h36m-36 5.5h46"/><path stroke="#d9e1ee" stroke-dasharray="4 4" d="M84 50v175m66-175v175m66-175v175"/><text x="18" y="262" font-size="14">4 equal columns; image in column 1</text></g><text x="30" y="412" fill="#526070" font-size="14">Standalone images only. Inline Markdown images and multi-image rows keep their existing layout.</text></g></svg>